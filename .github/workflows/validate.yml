name: validate
on: [push, pull_request]
jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -r requirements-validation.txt
      - run: python scripts/acquisition_frontier.py
      - run: python -m unittest discover -s scripts -p test_acquisition_frontier.py
      - run: python scripts/source_growth.py
      - run: python -m unittest discover -s scripts -p test_source_growth.py
      - run: python scripts/validate_release.py
      - run: python scripts/test_current_state.py
      - run: python scripts/research_dossiers.py
      - run: python scripts/test_research_dossiers.py
      - run: python scripts/build_release_manifest.py > /tmp/release-manifest.json

      - run: python scripts/validate_primary_pilot.py
      - run: python scripts/test_primary_pilot.py
      - run: python scripts/test_pre_expert_maximum.py

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [integrity]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Publish checked native milestone
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version=$(cat VERSION)
          tag="v$version"
          test -f "releases/$version.md"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Existing immutable release $tag retained."
          else
            existing=$(git ls-remote --tags origin "refs/tags/$tag" | cut -f1)
            if test -n "$existing"; then
              test "$existing" = "$GITHUB_SHA"
            else
              git tag "$tag" "$GITHUB_SHA"
              git push origin "refs/tags/$tag"
            fi
            gh release create "$tag" --verify-tag --latest=true --title "Cretan-hieroglpyhs $version" --notes-file "releases/$version.md"
          fi
